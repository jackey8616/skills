schema_version: "1.1"
name: cannot-determine-stops
expected_outcome: |
  calc.py itself imports acme_numerics, a company package that isn't
  installed and can't be, so no test of calc can run, wherever it is
  written. The implementer makes the change and arms the gate from its
  reply, but the tests can't run. The loop ends without spinning through
  rounds, and the final reply tells the user which dependency is missing and
  doesn't claim the change was verified. The run installs nothing.
