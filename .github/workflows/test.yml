name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ast-grep and zsh
        run: |
          npm install -g @ast-grep/cli@0.39.5
          sudo apt-get update -q
          sudo apt-get install -y -q zsh

      - name: Lint skills
        run: bash lint-skills.sh

      - name: Run every test
        run: |
          rc=0
          for t in *.test.sh skills/*/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t" || { rc=1; echo "::error file=$t::$t failed"; }
            echo "::endgroup::"
          done
          exit "$rc"
